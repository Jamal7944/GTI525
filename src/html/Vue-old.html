<div>

    <img src="../assets/Logo.png" alt="Logo">
    <table>
      <thead>
        <tr>
          <th v-for="(value, key) in csvData[0]" :key="key">{{ key }}</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="(row, index) in csvData.slice(1)" :key="index">
          <td v-for:="(value, key) in row" :key="key">{{ value }}</td>
        </tr>
      </tbody>
    </table>

    <div> {{minvalue}}</div>
</div>
