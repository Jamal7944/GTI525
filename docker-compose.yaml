services:
  mongodb:
    image: 'mongodb/mongodb-community-server:6.0-ubi8'
    restart: unless-stopped
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=admingr01eq04
      - MONGODB_INITDB_ROOT_PASSWORD=VFvCLTfeb6qRd6
    ports:
      - '27017:27017'
    volumes:
      - type: bind
        source: ./data
        target: /data/db
    networks:
      - node-network
  python-script:
    build: python-script
    depends_on:
      - mongodb
    networks:
      - node-network
  client:
    build: client
    restart: unless-stopped
    ports:
      - '8080:8080'
      - '8081:8081'
    networks:
      - node-network
    depends_on:
      - mongodb
networks:
  node-network:
    driver: bridge
