services:
  mongodb: # script https://www.mongodb.com/resources/products/compatibilities/docker
    image: mongodb/mongodb-community-server:6.0-ubi8
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=admingr01eq04
      - MONGODB_INITDB_ROOT_PASSWORD=VFvCLTfeb6qRd6
    ports:
      - '27017:27017'
    volumes:
      - type: bind
        source: ./data
        target: /data/db
    networks:
      - node-network

networks:
  node-network:
    driver: bridge