<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
	integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<div id="mapContainer"></div>
<div id="optionContainer">
	<button v-on:click="recenterOnClick()">Recenter</button>
	<br>
	<button hidden v-on:click="refreshOnClick()">Rafraîchir</button>
	<br>
	<label>Prévisions pour:  </label>
	<select id="dayOption" v-on:change="optionChanged()">
		<option v-for="(text, index) in displayed" :key="index">{{text}}</option>
	</select>
	<br>
	<br>
	<p style="color: red; font-size: small;">
		En raison d'un bug hors de notre contrôle, veuillez redimensionner votre 
		navigateur et le remettre à sa taille d'origine pour pouvoir afficher les 
		prévisions détaillées ou recentrer la carte.
		
	</p>
</div>
