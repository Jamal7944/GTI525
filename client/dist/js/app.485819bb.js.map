


<h2 class="dataTitle" id="station_displayed_id"><i></i></h2>
<h4 class="dataTitle">Plage de dates:</h4>
<div class="row" id="rowDatePicker">
  <div class="col-9" id="colDatePicker">
    <div class="row">
      <div class="col-6">
        <span>De:  </span>
        <select id="anneeDebut" class="form-select" aria-label="année" v-on:change="plageDatesOnChange();">
          <option v-for="(year) in years">{{year}}</option>
        </select>
        <select id="moisDebut" class="form-select" aria-label="mois" v-on:change="plageDatesOnChange();">
          <option v-for="(name) in monthNames">{{name}}</option>
        </select>
      </div>
      <div class="col-6">
        <span>  À:  </span>
        <select id="anneeFin" class="form-select" aria-label="année" v-on:change="plageDatesOnChange();">
          <option v-for="(year) in years">{{year}}</option>
        </select>
        <select id="moisFin" class="form-select" aria-label="mois" v-on:change="plageDatesOnChange();">
          <option v-for="(name) in monthNames">{{name}}</option>
        </select>
      </div>
      </div>

  </div>
  <div class="col-3">
        <button class="btn btn-outline-primary" id="toutesDonnees" v-on:click="toutesDonneesOnClick();">Tout les données</button>
  </div>
</div>
  <div id="dataTab">
 
  <ul class="nav nav-tabs" id="dataTabs">
    <li class="nav-item">
      <button class="nav-link active" id="data-tab" data-bs-toggle="tab" data-bs-target="#data" type="button" role="tab" aria-controls="home" aria-selected="true">Data</button>
      
    </li>
    <li class="nav-item">
      <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#statistic" type="button" role="tab" aria-controls="statistic" aria-selected="false">Statistique </button>
    </li>
  </ul>
  <div class="tab-content" id="dataTabsContent">
    <div class="tab-pane fade show active" id="data" role="tabpanel" aria-labelledby="data-tab">
      <div id="T4-1_vueDonnees" v-html="T4_1_vueDonnees_HTML"> </div>
    </div>
    <div class="tab-pane fade" id="statistic" role="tabpanel" aria-labelledby="statistic-tab">
      <div id="T5-1_statsGlob" v-html="T5_1_statsGlob_HTML"> </div>
      <div id="T5-2_statsMensuel" v-html="T5_2_statsMensuel"> </div>
    </div>
  </div>
</div>
